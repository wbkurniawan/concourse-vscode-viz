<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concourse Pipeline Preview</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #pipeline-container {
      width: 100%;
      height: 100vh;
    }
    
    /* Styling for the pipeline graph */
    svg.pipeline-graph {
      width: 100%;
      height: 100%;
    }

    /* Node styles */
    .node text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      fill: #333;
    }

    .node.job rect {
      fill: #3498db;
      stroke: #2980b9;
      stroke-width: 1px;
    }

    .node.resource rect {
      fill: #2ecc71;
      stroke: #27ae60;
      stroke-width: 1px;
    }

    /* Edge styles */
    .edge path {
      fill: none;
      stroke: #95a5a6;
      stroke-width: 2px;
    }

    /* Status colors */
    .node.succeeded rect { fill: #2ecc71; }
    .node.failed rect { fill: #e74c3c; }
    .node.pending rect { fill: #f39c12; }
    .node.paused rect { fill: #95a5a6; }
    .node.no-builds rect { fill: #bdc3c7; }
    
    /* Active/hover state */
    .node.active rect, .edge.active path {
      stroke: #f1c40f;
      stroke-width: 2px;
    }
  </style>
</head>
<body>
  <div id="pipeline-container"></div>
</body>
</html>
